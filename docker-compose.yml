services:
  python311:
    build:
      context: .
      dockerfile: docker/Dockerfile.311
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    working_dir: /workspace
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pysymex-pycache
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    restart: unless-stopped

