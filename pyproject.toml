[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysymex"
version = "0.1.0a5"
description = "EDUCATIONAL PURPOSES ONLY: A symbolic execution engine for studying formal verification concepts. Not for production use."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    {name = "pysymex Team"}
]
keywords = [
    "symbolic-execution",
    "static-analysis",
    "bytecode",
    "z3",
    "educational",
    "research-prototype",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "z3-solver==4.15.3.0",          # 4.15.4+ and 4.16 have documented perf regressions
    "pydantic>=2.12.0,<3.0",        # tightened from 2.10.0 to match actual installed version
    "immutables==0.21",              # 0.21 adds Python 3.13 pre-built wheels
    "rich>=13.0.0",                  # runtime dep — used in cli/scan.py and reporting/formatters.py
]

[project.optional-dependencies]
sandbox = [
    "wasmtime>=14.0.0",             # optional WASM isolation backend (sandbox/isolation/wasm.py)
]

[project.scripts]
pysymex = "pysymex.cli:main"

[project.urls]
Homepage = "https://github.com/darkoss1/pysymex"
Documentation = "https://github.com/darkoss1/pysymex#readme"
Repository = "https://github.com/darkoss1/pysymex"
Issues = "https://github.com/darkoss1/pysymex/issues"


[tool.hatch.build.targets.wheel]
packages = ["pysymex"]

[tool.hatch.build.targets.sdist]
include = ["/pysymex"]


[tool.uv]
default-groups = ["dev"]


[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "pytest-cov>=6.0",
    "pytest-codspeed>=3.0",
    "pytest-benchmark>=5.2.0",
    "pytest-randomly>=4.1.0",
    "pytest-memray>=1.8.0; sys_platform != 'win32'",
    "hypothesis>=6.100",
    "crosshair-tool>=0.0.104",
    "atheris>=2.3.0; sys_platform != 'win32' and python_version >= '3.11' and python_version < '3.14'",
    "ruff>=0.15.0",
    "pyright>=1.1.0",
    "import-linter>=2.11",
    "deptry>=0.25.1",
    "vulture>=2.16",
    "mutmut>=3.5.0",
    "semgrep>=1.162.0",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "memray>=1.19.0; sys_platform != 'win32'",
    "scalene>=1.5; sys_platform != 'win32'",
    "py-spy>=0.4.2",
    "psutil>=7.2.2",
    "viztracer>=1.1.0",
    "bytecode>=0.15",
    "xdis>=6.3.0",
    "icontract>=2.6",

]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
norecursedirs = [
    ".hypothesis", ".pytest_runtime", "_tmp_rt_*", "__pycache__",
    ".git", ".venv", "tests_backup", "benchmarks", "docs",
    "docker", "examples", "scripts",
]
addopts = "-v --tb=short -n auto --import-mode=importlib --durations=25 --durations-min=2.0"
asyncio_mode = "auto"
timeout = 120
timeout_method = "thread"
markers = [
    "timeout: per-test timeout override (provided by pytest-timeout)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bench: benchmark tier tests",
    "repro: regression reproduction tests",
]


[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", ".github", ".venv", "docs", "docker"]

[tool.ruff.lint]
# Several modules intentionally perform path setup, opcode registration, or
# logger initialization before follow-on imports. Keep that policy explicit
# instead of scattering per-line suppressions across generated legacy modules.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pyright]
include = ["pysymex", "tests"]
stubPath = "typings"
typeCheckingMode = "strict"
exclude = ["scripts", "examples", "benchmarks", "docs", "docker"]


[tool.coverage.run]
source = ["pysymex"]
branch = true
parallel = true
omit = ["pysymex/__pycache__/*", "pysymex/_*.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"
